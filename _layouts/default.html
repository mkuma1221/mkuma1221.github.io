<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">

  <script src="https://cdn.jsdelivr.net/npm/@tsparticles/slim@3.1.0/tsparticles.slim.bundle.min.js"></script>
</head>

<body>
  <section class="page-header">
    <div id="tsparticles"></div>

    <h1 class="project-name">{{ site.title }}</h1>
    <h2 class="project-tagline">{{ site.description }}</h2>
  </section>

  <section class="main-content">
    {{ content }}
  </section>

  {% raw %}
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      tsParticles.load("tsparticles", {
        fullScreen: { enable: false },
        fpsLimit: 60,
        particles: {
          number: {
            value: 120,
            density: { enable: true, value_area: 800 }
          },
          color: { value: "#ffffff" },
          shape: { type: "circle" },
          opacity: {
            value: { min: 0.15, max: 0.9 },
            animation: {
              enable: true,
              speed: 1.2,
              minimumValue: 0.1,
              sync: false
            }
          },
          size: {
            value: { min: 0.8, max: 2.2 },
            animation: {
              enable: true,
              speed: 1,
              minimumValue: 0.4,
              sync: false
            }
          },
          move: {
            enable: true,
            speed: 0.35,
            direction: "none",
            random: true,
            straight: false,
            outModes: { default: "out" }
          }
        },
        interactivity: {
          detectsOn: "canvas",
          events: {
            onHover: {
              enable: true,
              mode: "grab"
            },
            onClick: {
              enable: true,
              mode: "push"
            },
            resize: true
          },
          modes: {
            grab: {
              distance: 140,
              links: { opacity: 0.35, color: "#ffffff" }
            },
            push: { quantity: 4 }
          }
        },
        detectRetina: true
      });
    });
  </script>
  {% endraw %}
</body>
</html>
